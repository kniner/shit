name: Supabase keep-alive

# Supabase pauses free-tier projects after ~7 days with no activity, which makes
# the planner load empty until someone manually resumes it. This hits the DB on
# a schedule so an ACTIVE project stays awake. It cannot wake a project that has
# already paused (its hostname stops resolving) — resume that in the dashboard.
# Needs the same secrets the app build uses (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY).
#
# NOTE: GitHub runs scheduled workflows only from the repository's DEFAULT
# branch, which is currently claude/eloquent-bardeen-m8gwvr — that's why this
# file lives here as well as on claude/main.
on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the plans table to keep the project active
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set; nothing to keep alive."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/plans?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
          if [ -n "$code" ] && [ "$code" != "000" ]; then
            echo "Supabase is awake (HTTP $code) — kept alive."
          else
            # Don't fail the run: a paused project can't be woken from here, and a
            # red X every 3 days is just noise. Flag it as a warning instead.
            echo "::warning::Supabase did not respond — the project is likely paused. Resume it in the dashboard; this ping keeps an active project awake but can't wake a paused one."
          fi
